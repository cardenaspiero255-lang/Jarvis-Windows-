name: Real Virtual Voice Windows Acceptance

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  sapi-whisper-wake:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install actual JARVIS offline STT runtime
        run: python -m pip install --disable-pip-version-check numpy pyaudio faster-whisper
      - name: Real Windows SAPI WAV to local Whisper + noisy wake/negative test
        shell: powershell
        run: ./scripts/windows-virtual-voice.ps1
      - name: Preserve compact fail-closed report (never upload WAV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-virtual-voice-evidence
          path: ${{ runner.temp }}/jarvis-virtual-voice-acceptance.json
          if-no-files-found: warn
          retention-days: 14
