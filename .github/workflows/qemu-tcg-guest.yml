# Trusted-ONLY guest boot proof. QEMU TCG runs on disposable GitHub Linux,
# needs no /dev/kvm and never boots third-party repositories.
name: QEMU TCG Trusted Guest E2E
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qemu-tcg-guest.yml'
      - 'jarvis-studio-backend/qemu_tcg_guest.py'
      - 'jarvis-studio-backend/test_qemu_tcg_guest.py'
      - 'scripts/qemu-fixture-proof.sh'
      - 'jarvis-studio-backend/controlled_repository_agent.py'
      - 'jarvis-studio-backend/isolated_repo_runner.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-tcg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-python-guest:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify QEMU VM guest policy contracts
        working-directory: jarvis-studio-backend
        run: python -m unittest -v test_qemu_tcg_guest
      - name: Boot a real Linux guest and execute bounded fixture regression
        shell: bash
        run: bash scripts/qemu-fixture-proof.sh
      - name: Save VM guest execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-trusted-qemu-guest-proof
          path: ${{ runner.temp }}/jarvis-vm-guest-proof.json
          if-no-files-found: error
          retention-days: 7
