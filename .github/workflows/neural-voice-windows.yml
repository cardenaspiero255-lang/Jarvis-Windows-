name: Windows Neural Voice Models Acceptance

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  piper-real:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real neural Piper runtime
        run: python -m pip install --disable-pip-version-check piper-tts==1.8.0 numpy
      - name: Execute actual JARVIS Piper path, waveform audit and late cancel
        shell: pwsh
        run: |
          python ./jarvis-studio-backend/real_neural_voice_e2e.py piper --receipt "$env:RUNNER_TEMP/jarvis-neural-piper-receipt.json"
          if ($LASTEXITCODE -ne 0) { throw "Piper real model acceptance FAILED" }
      - name: Preserve Piper proof even on failure (no PCM or model assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-real-piper-voice-proof
          path: ${{ runner.temp }}/jarvis-neural-piper-receipt.json
          retention-days: 14
          if-no-files-found: warn

  wake-acoustic-real:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine openWakeWord model dependencies
        run: python -m pip install --disable-pip-version-check openwakeword==0.6.0 onnxruntime pyaudio==0.2.14 numpy
      - name: Score SAPI positive and negative WAV via real JARVIS openWakeWord
        shell: pwsh
        run: ./scripts/windows-openwakeword-fixtures.ps1
      - name: Preserve acoustic wake proof even on failure (no PCM or model)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-real-openwakeword-proof
          path: ${{ runner.temp }}/jarvis-neural-wake-receipt.json
          retention-days: 14
          if-no-files-found: warn
