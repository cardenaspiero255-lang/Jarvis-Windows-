name: Windows FULL Offline and Whisper Local Acceptance
on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/windows-full-whisper-acceptance.yml'
      - 'scripts/windows-real-whisper-local-wake.ps1'
      - 'jarvis-studio-backend/real_whisper_local_windows.py'
      - 'jarvis-studio-backend/test_real_whisper_local_windows.py'
      - 'jarvis-studio-backend/wake_word/whisper_local_wake.py'
      - 'jarvis-studio-backend/full_offline_bundle_audit.py'
      - 'jarvis-studio-backend/tts/tts_engine.py'
      - 'scripts/package-backend.ps1'
      - 'scripts/prefetch_preload_assets.py'
      - 'jarvis-studio-backend/jarvis-backend.spec'
      - 'scripts/build.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-full-whisper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-whisper-real-model:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit-regress real synthetic diagnostics and local wake
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check numpy faster-whisper pyaudio huggingface_hub
          Push-Location jarvis-studio-backend
          try { python -m unittest -v test_real_whisper_local_windows test_whisper_local_wake }
          finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw "Local wake tests failed" }
      - name: Parse the audio generator script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/windows-real-whisper-local-wake.ps1"), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw "PowerShell audio script did not parse" }
      - name: Run real offline Whisper CPU model on Windows SAPI audio
        shell: pwsh
        run: ./scripts/windows-real-whisper-local-wake.ps1
      - name: Upload diagnostic JSON only (no WAVs or model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-real-whisper-local-windows-receipt
          path: ${{ runner.temp }}/jarvis-local-whisper-wake-receipt.json
          if-no-files-found: warn
          retention-days: 14

  full-offline-installer-real-windows:
    runs-on: windows-latest
    timeout-minutes: 115
    env:
      JARVIS_WAKE_PACKAGE_MODE: whisper_local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jarvis-studio-gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native Windows installed-runtime probe prerequisites
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websockets==12.0 playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw "Probe prerequisite install failed" }
      - name: Verify FULL asset integrity test contracts
        shell: pwsh
        run: |
          Push-Location jarvis-studio-backend
          try { python -m unittest -v test_full_offline_bundle_audit test_commercial_wake_release_gate }
          finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw "FULL bundle security tests failed" }
      - name: Build genuine FULL non-Lean Windows NSIS
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify exact staged FULL assets, restricted weights absent and pinned hashes
        shell: pwsh
        run: |
          python jarvis-studio-backend/full_offline_bundle_audit.py --bundle "jarvis-studio-gui/src-tauri/resources/jarvis-backend" --engine whisper_local --receipt "$env:RUNNER_TEMP/jarvis-full-asset-preflight.json"
          if ($LASTEXITCODE -ne 0) { throw "FULL offline asset hashes/licensing gate FAILED" }
      - name: Install exact FULL bundle and verify real WebView2, Qwen, WebSocket, rollback and uninstall
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "jarvis-studio-gui/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($files.Count -ne 1) { throw "Expected one exact FULL NSIS installer" }
          ./scripts/prepare-installed-ollama.ps1 -InstallerPath $files[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Actual installed FULL runtime E2E FAILED" }
      - name: Verify unsigned FULL setup is NOT public-release eligible
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "jarvis-studio-gui/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($files.Count -ne 1) { throw "Expected one exact FULL NSIS setup" }
          $result = Get-AuthenticodeSignature -LiteralPath $files[0].FullName
          if ($result.Status -eq "Valid") { Write-Host "Valid signature observed; expected owner certificate is still unverified" }
          else { Write-Host "Unsigned FULL setup cannot be publicly released" }
      # Only private test distribution, after all real installed E2E gates pass.
      - name: Create SHA256 receipt for exact tested FULL notebook installer
        if: success()
        shell: pwsh
        run: |
          $directory = "jarvis-studio-gui/src-tauri/target/release/bundle/nsis"
          $files = @(Get-ChildItem -LiteralPath $directory -Filter "*.exe" -File)
          if ($files.Count -ne 1) { throw "Expected exactly one verified FULL NSIS installer" }
          $digest = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -notmatch '^[0-9a-f]{64}$') { throw "Invalid SHA256" }
          "$digest *$($files[0].Name)" | Set-Content -LiteralPath (Join-Path $directory "jarvis-full-installer.sha256") -Encoding ascii
          Write-Host "FULL physical-test artifact SHA256=$digest"

      - name: Save unsigned FULL installer for private notebook testing, not public release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-unsigned-full-notebook-test
          path: |
            jarvis-studio-gui/src-tauri/target/release/bundle/nsis/*.exe
            jarvis-studio-gui/src-tauri/target/release/bundle/nsis/jarvis-full-installer.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve actual FULL asset and installed runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-full-real-installed-receipts
          path: |
            ${{ runner.temp }}/jarvis-full-asset-preflight.json
            ${{ runner.temp }}/installer-smoke-proof.json
            ${{ runner.temp }}/jarvis-installed-runtime-proof.json
            ${{ runner.temp }}/jarvis-installed-ui-diagnostic.json
            ${{ runner.temp }}/jarvis-installed-webview.png
            ${{ runner.temp }}/jarvis-python-build-dependencies.txt
          if-no-files-found: warn
          retention-days: 14
