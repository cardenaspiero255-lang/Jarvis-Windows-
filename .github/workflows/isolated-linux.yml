# This job never runs project code directly on Windows or Linux host.
# Only tests from a fixed, small fixture run inside a locked-down Docker container.
name: Isolated Linux Fixture E2E

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/isolated-linux.yml'
      - 'jarvis-studio-backend/isolated_repo_runner.py'
      - 'jarvis-studio-backend/test_isolated_repo_runner.py'
      - 'jarvis-studio-backend/test_isolated_container_lifecycle.py'
      - 'jarvis-studio-backend/test_isolated_model_integration.py'
      - 'jarvis-studio-backend/real_local_model_e2e.py'
      - 'jarvis-studio-backend/ollama_diagnostics.py'
      - 'scripts/real-ollama-linux.sh'
      - 'scripts/qemu-fixture-proof.sh'
      - 'jarvis-studio-backend/qemu_tcg_guest.py'
      - 'jarvis-studio-backend/trusted_repair_workflow.py'
      - 'jarvis-studio-backend/real_guest_repair_e2e.py'
      - 'jarvis-studio-backend/test_trusted_repair_workflow.py'
      - 'jarvis-studio-backend/test_real_guest_repair_e2e.py'
      - 'jarvis-studio-backend/test_isolation_workflow.py'
      - 'jarvis-studio-backend/fixtures/isolation_repo/**'
      - 'jarvis-studio-backend/controlled_repository_agent.py'
      - 'jarvis-studio-backend/local_coding_pipeline.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-multimodule-tests:
    # Fork PRs must never trigger code from an untrusted contribution.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official Python container image on disposable Linux runner
        shell: bash
        run: docker pull python:3.11-slim-bookworm
      - name: Verify isolation with failing baseline and successful patch
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.11-slim-bookworm)"
          python jarvis-studio-backend/isolated_repo_runner.py --ci-demo --image-ref "$image_ref"
      - name: Upload nonsecret isolation receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-isolation-proof
          path: ${{ runner.temp }}/jarvis-isolation-proof.json
          retention-days: 7
          if-no-files-found: error

  real-gguf-sandbox:
    needs: isolated-multimodule-tests
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve pinned Python Docker image
        run: docker pull python:3.11-slim-bookworm
      - name: Local genuine GGUF proposal and isolated Docker regression
        shell: bash
        run: bash ./scripts/real-ollama-linux.sh
      - name: Publish nonsecret local GGUF plus Docker receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-gguf-isolated-proof
          path: ${{ runner.temp }}/jarvis-isolation-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish QEMU guest + approved local Git proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-real-gguf-qemu-git-proof
          path: ${{ runner.temp }}/jarvis-model-guest-repair-proof.json
          if-no-files-found: error
          retention-days: 7
