name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# E2E smoke reads GitHub metadata/code with a short-lived read-only token.
# No Actions rerun, PR mutation or push is permitted from this workflow.
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: jarvis-studio-gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jarvis-studio-gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Build frontend
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  rust-check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: jarvis-studio-gui/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jarvis-studio-gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate icons
        working-directory: jarvis-studio-gui
        run: npm ci && npm run icons

      - name: Cargo check
        run: cargo check

  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: jarvis-studio-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Compile Python sources
        run: python -m compileall -q .

      # The test suite needs far less than requirements.txt: no torch (easyocr),
      # no Playwright, no aiortc, no Windows-automation stack. This list is the
      # verified minimum for `unittest discover` — extend it if a new test pulls
      # in a module that is imported at module scope.
      - name: Install test dependencies
        run: pip install websockets httpx cryptography numpy pyaudio faster-whisper pillow

      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py" -t .

      - name: GitHub PR E2E (read-only, same-repo pull requests only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JARVIS_E2E_REPOSITORY: ${{ github.repository }}
          JARVIS_E2E_PR: ${{ github.event.pull_request.number }}
          JARVIS_E2E_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python github_pr_live_smoke.py
